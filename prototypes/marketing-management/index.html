&lt;script&gt;(() =&gt; {
  const root = document.documentElement;
  const mediaQuery = globalThis.matchMedia(&quot;(prefers-color-scheme: dark)&quot;);

    &quot;codex-visualization-widget-state&quot;,
  );

  const pendingStateWrites = new Map();
  const persistenceError = () =&gt;
    Object.assign(
      new Error(&quot;The host could not persist the widget state update&quot;),
      {
        code: -32000,
        data: { code: &quot;widget_state_persistence_failed&quot;, retryable: false },
      },
    );

   * @param {string} property
   */

    return getter;
  };

  const getMessagePorts = getPrototypeGetter(MessageEvent.prototype, &quot;ports&quot;);
  const getMessageSource = getPrototypeGetter(MessageEvent.prototype, &quot;source&quot;);

  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs

  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const startHostPort = MessagePort.prototype.start;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const stopMessagePropagation = Event.prototype.stopImmediatePropagation;

  const postToHost = (type, payload) =&gt; {

    }
  };

    }
  };

    if (globalThis.navigator.userActivation?.isActive === true) {
      postToHost(&quot;follow-up&quot;, { context, prompt, title });
    }
    return Promise.resolve();
  };
  /**
   * @param {Record&lt;string, unknown&gt; | ((previous: Record&lt;string, unknown&gt; | null) =&gt; Record&lt;string, unknown&gt;)} next
   * @returns {Promise&lt;void&gt;}
   */
  const setWidgetState = async (next) =&gt; {
    const nextState = typeof next === &quot;function&quot; ? next(state) : next;
    if (
      nextState == null ||
      typeof nextState !== &quot;object&quot; ||
      isArray(nextState)
    ) {
      throw new TypeError(&quot;Widget state must be a JSON object&quot;);
    }
    const inputState = stringify(
      nextState,
      (_key, /** @type {unknown} */ value) =&gt; {
        if (
          typeof value === &quot;undefined&quot; ||
          typeof value === &quot;function&quot; ||
          typeof value === &quot;symbol&quot; ||
          (typeof value === &quot;number&quot; &amp;&amp; !Number.isFinite(value))
        ) {
          throw new TypeError(&quot;Widget state must be a JSON object&quot;);
        }
        return value;
      },
    );

      parsedState == null ||
      typeof parsedState !== &quot;object&quot; ||
      isArray(parsedState)
    ) {
      throw new TypeError(&quot;Widget state must be a JSON object&quot;);
    }

      modelContent: null,
      privateContent: null,
      ...parsedState,
    };

        &quot;Widget state must be a JSON object of at most 16 KiB&quot;,

    }

      hasOwn(storedState, &quot;imageIds&quot;) &amp;&amp;

        storedState.imageIds.some(
          (/** @type {unknown} */ id) =&gt; typeof id !== &quot;string&quot;,

    ) {
      throw new TypeError(&quot;Widget state imageIds must be an array of strings&quot;);
    }

      throw Object.assign(
        new TypeError(&quot;Visualization state does not support image attachments&quot;),

    globalThis.openai.widgetState = state;
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {
        detail: { globals: { widgetState: state } },
      }),
    );
    if (statePersistence === &quot;none&quot;) {
      throw persistenceError();
    }
    const id = ++nextStateRequestId;
    return new Promise((resolve, reject) =&gt; {
      const timeout = globalThis.setTimeout(() =&gt; {
        pendingStateWrites.delete(id);
        reject(persistenceError());
      }, 30_000);
      pendingStateWrites.set(id, { resolve, reject, timeout, serializedState });
      postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });
    });
  };
  const syncTheme = () =&gt; {
    const theme = mediaQuery.matches ? &quot;dark&quot; : &quot;light&quot;;
    root.dataset.theme = theme;
    globalThis.openai = {
      ...globalThis.openai,
      openExternal,
      sendFollowUpMessage,
      setWidgetState,
      theme,
      visualizationStyleVariables: {},
      visualizationTheme: theme,
      widgetState: state,
      statePersistence,
      stateModelContext: &quot;none&quot;,
    };
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {
        detail: { globals: globalThis.openai },
      }),
    );
  };
  const sendHeight = () =&gt; {
    postToHost(&quot;height&quot;, {
      height: Math.ceil(
        Math.max(
          document.body.scrollHeight,
          document.body.getBoundingClientRect().height,
        ),
      ),
    });
  };

  globalThis.addEventListener(
    &quot;message&quot;,
    (event) =&gt; {
      const data = apply(getMessageData, event, []);
      const ports = apply(getMessagePorts, event, []);
      const source = apply(getMessageSource, event, []);
      if (
        hostPort != null ||
        source !== parentWindow ||
        typeof data !== &quot;object&quot; ||
        data?.type !== &quot;codex-visualization-initialize&quot; ||
        !isArray(ports) ||
        ports.length !== 1
      ) {
        return;
      }
      apply(stopMessagePropagation, event, []);
      const nextHostPort = ports[0];
      try {
        apply(addHostMessageListener, nextHostPort, [
          &quot;message&quot;,
          (event) =&gt; {
            const data = apply(getMessageData, event, []);
            if (typeof data === &quot;object&quot; &amp;&amp; data?.type === &quot;measure&quot;) {
              sendHeight();
            } else if (
              typeof data === &quot;object&quot; &amp;&amp;
              data?.type === &quot;widget-state-result&quot;
            ) {
              /** @type {unknown} */
              const id = data.id;
              if (typeof id !== &quot;number&quot;) {
                return;
              }
              const pending = pendingStateWrites.get(id);
              if (pending != null) {
                pendingStateWrites.delete(id);
                globalThis.clearTimeout(pending.timeout);
                if (data.ok === true) {
                  pending.resolve();
                } else {
                  pending.reject(persistenceError());
                }
              }
            }
          },
        ]);
        apply(startHostPort, nextHostPort, []);
      } catch {
        return;
      }
      hostPort = nextHostPort;
      for (const [id, { serializedState }] of pendingStateWrites) {
        postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });
      }
      sendHeight();
    },
    { capture: true },
  );
  document.currentScript?.remove();
  mediaQuery.addEventListener(&quot;change&quot;, syncTheme);
  globalThis.addEventListener(&quot;click&quot;, (event) =&gt; {
    if (event.defaultPrevented) {

    }
    let element = null;
    if (event.target instanceof globalThis.Element) {
      element = event.target;

      return;
    }
    if (href.startsWith(&quot;#&quot;)) {
      let id;
      try {
        id = decodeURIComponent(href.slice(1));
      } catch {
        return;
      }

        target == null ||
        globalThis.navigator.userActivation?.isActive !== true

      }

        top: target.getBoundingClientRect().top + globalThis.scrollY,
      });
      return;
    }

    openExternal({ href });
  });

  syncTheme();

  &lt;div class=&quot;sm-notes&quot;&gt;&lt;details&gt;&lt;summary&gt;Proposal notes &amp; client confirmations&lt;/summary&gt;
    &lt;p&gt;&lt;strong&gt;E-transfer proposal:&lt;/strong&gt; An Interac deposit confirmation creates an Unclaimed Marketing transfer. OP claims with the bank-transfer sender name and amount; a unique eligible match adds credits once and marks the transfer Claimed. The report separates Client Payment from Operator Payment. This demo uses immediate credit release; &lt;strong&gt;BC funding approval still requires client confirmation.&lt;/strong&gt; Bank reconciliation is not a prerequisite. Notification import is simulated, not connected to Interac.&lt;/p&gt;
    &lt;p&gt;&lt;strong&gt;Profit layout:&lt;/strong&gt; Marketing Expense is a detail included in Fixed Expenses. It reduces Net Profit, not Gross Profit, and is not deducted twice. The zero-value preview is not linked to funding or batch posting; expense-recognition timing and journal mapping await Nat / Maria.&lt;/p&gt;
    &lt;ul&gt;&lt;li&gt;&lt;strong&gt;Confirmed:&lt;/strong&gt; Credit cards load reusable Marketing credits, separately from payroll. Marketers use leads × rate per lead; callers use conversions × rate per conversion. OP enters the final amount.&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Confirmed:&lt;/strong&gt; The combined payroll Marketing total shares one OP credit balance. Submission reserves credits; BC approves without editing; HO reviews without editing and posting consumes the reservation once.&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Confirm with Louis:&lt;/strong&gt; Should the employee Payment Log update when HO posts the batch? This demo uses that trigger. A posted amount is not proof of an employee bank deposit.&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Confirm with Louis:&lt;/strong&gt; Track payments only per employee and payroll period, with no allocation to individual calling dates or marketing sessions? This demo keeps work and payment records separate.&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Open — Nat / Maria:&lt;/strong&gt; Credit liability GL, funding journal, expense/payroll journals, reconciliation, ADP mapping, burden and payment execution. Posting hands off to accounting; this demo does not create journals or export Marketing to ADP.&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Open — Louis:&lt;/strong&gt; Final rules for lead/conversion attribution, payroll cutoffs, rate changes, and corrections. Sample results and rates are illustrative, not integration rules.&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Open:&lt;/strong&gt; Credit-release rules for rejection, withdrawal, or correction after submission. No such process is invented here.&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Scope:&lt;/strong&gt; Operational proposal only. Existing full-payroll validation and batch-post eligibility remain in force; demo actions simulate the Marketing segment. Advertising spend is a separate flow.&lt;/li&gt;&lt;/ul&gt;
    &lt;button class=&quot;sm-button&quot; type=&quot;button&quot; data-reset&gt;Reset demo data&lt;/button&gt;
  &lt;/details&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
(() =&gt; {
  const root=document.getElementById(&#x27;simon-marketing-proposal&#x27;);
  const q=s=&gt;root.querySelector(s), main=q(&#x27;[data-main]&#x27;);
  // Sample data boundary: no API calls or real card processing.
  const EMP=[{id:&#x27;alice&#x27;,name:&#x27;Alice Johnson&#x27;,role:&#x27;Marketer&#x27;,unit:&#x27;lead&#x27;,count:18,rate:2000},{id:&#x27;michael&#x27;,name:&#x27;Michael Lee&#x27;,role:&#x27;Caller&#x27;,unit:&#x27;conversion&#x27;,count:8,rate:2500}];
  const WORK=[{id:&#x27;a1&#x27;,employee:&#x27;alice&#x27;,date:&#x27;2026-10-06&#x27;,session:&#x27;Door knocking · Oak Street&#x27;,hours:4,units:6},{id:&#x27;a2&#x27;,employee:&#x27;alice&#x27;,date:&#x27;2026-10-09&#x27;,session:&#x27;Door knocking · Maple Avenue&#x27;,hours:3.5,units:5},{id:&#x27;a3&#x27;,employee:&#x27;alice&#x27;,date:&#x27;2026-10-15&#x27;,session:&#x27;Door knocking · Pine Street&#x27;,hours:4.5,units:7},{id:&#x27;m1&#x27;,employee:&#x27;michael&#x27;,date:&#x27;2026-10-07&#x27;,session:&#x27;Calling&#x27;,hours:2,units:3},{id:&#x27;m2&#x27;,employee:&#x27;michael&#x27;,date:&#x27;2026-10-12&#x27;,session:&#x27;Calling&#x27;,hours:2.5,units:2},{id:&#x27;m3&#x27;,employee:&#x27;michael&#x27;,date:&#x27;2026-10-16&#x27;,session:&#x27;Calling&#x27;,hours:2,units:3}];
  const SCREENS=[&#x27;funding&#x27;,&#x27;checkout&#x27;,&#x27;payroll&#x27;,&#x27;bc&#x27;,&#x27;ho&#x27;,&#x27;log&#x27;,&#x27;marketer&#x27;,&#x27;caller&#x27;,&#x27;profit&#x27;,&#x27;report&#x27;];
  const receivedTransfers=()=&gt;[
    {id:&#x27;DEMO-MKT-001&#x27;,channel:&#x27;operator&#x27;,mailbox:&#x27;marketing@studentworks.com&#x27;,date:&#x27;2026-10-22&#x27;,name:&#x27;Cameron Roach&#x27;,email:&#x27;cameron@example.test&#x27;,ref:&#x27;E-TRANSFER MKT001&#x27;,amount:25000,status:&#x27;Unclaimed&#x27;,operator:&#x27;&#x27;,invoice:&#x27;&#x27;},
    {id:&#x27;DEMO-MKT-002&#x27;,channel:&#x27;operator&#x27;,mailbox:&#x27;marketing@studentworks.com&#x27;,date:&#x27;2026-10-22&#x27;,name:&#x27;Roach Painting&#x27;,email:&#x27;business@example.test&#x27;,ref:&#x27;E-TRANSFER MKT002&#x27;,amount:15000,status:&#x27;Unclaimed&#x27;,operator:&#x27;&#x27;,invoice:&#x27;&#x27;},
    {id:&#x27;DEMO-CLIENT-001&#x27;,channel:&#x27;client&#x27;,mailbox:&#x27;pay@studentworks.com&#x27;,date:&#x27;2026-06-26&#x27;,name:&#x27;Linh&#x27;,email:&#x27;&#x27;,ref:&#x27;E-TRANSFER ***CKj&#x27;,amount:20009,status:&#x27;Unclaimed&#x27;,operator:&#x27;&#x27;,invoice:&#x27;&#x27;}
  ];
  const fresh=()=&gt;({version:2,screen:&#x27;funding&#x27;,balance:60000,reserved:0,phase:&#x27;draft&#x27;,amounts:[&#x27;360.00&#x27;,&#x27;200.00&#x27;],notes:[&#x27;&#x27;,&#x27;&#x27;],snapshot:null,fundings:[{date:&#x27;Oct 12, 2026&#x27;,method:&#x27;Credit card&#x27;,amount:50000,ref:&#x27;DEMO-FUND-002&#x27;},{date:&#x27;Sep 28, 2026&#x27;,method:&#x27;Credit card&#x27;,amount:30000,ref:&#x27;DEMO-FUND-001&#x27;}],fundAmount:&#x27;500.00&#x27;,fundResult:&#x27;&#x27;,filters:{employee:&#x27;all&#x27;,role:&#x27;all&#x27;,from:&#x27;2026-10-05&#x27;,to:&#x27;2026-10-18&#x27;,period:&#x27;all&#x27;},section:&#x27;marketing&#x27;,fundTab:&#x27;management&#x27;,transfers:receivedTransfers(),reportTab:&#x27;client&#x27;,reportFilters:{query:&#x27;&#x27;,from:&#x27;2026-02-02&#x27;,to:&#x27;2026-10-22&#x27;,status:&#x27;all&#x27;,min:&#x27;&#x27;,max:&#x27;&#x27;}});
  let state=fresh(), message=&#x27;&#x27;, error=&#x27;&#x27;, busy=false;
  let drawerOpen=false, drawerName=&#x27;&#x27;, drawerAmount=&#x27;&#x27;, drawerError=&#x27;&#x27;;
  const sessionId=&#x27;marketing-demo-&#x27;+Date.now()+&#x27;-&#x27;+Math.random().toString(36).slice(2);
  const cash=n=&gt;new Intl.NumberFormat(&#x27;en-CA&#x27;,{style:&#x27;currency&#x27;,currency:&#x27;CAD&#x27;}).format(n/100);
  const esc=v=&gt;String(v??&#x27;&#x27;).replace(/[&amp;&lt;&gt;&quot;&#x27;]/g,c=&gt;({&#x27;&amp;&#x27;:&#x27;&amp;amp;&#x27;,&#x27;&lt;&#x27;:&#x27;&amp;lt;&#x27;,&#x27;&gt;&#x27;:&#x27;&amp;gt;&#x27;,&#x27;&quot;&#x27;:&#x27;&amp;quot;&#x27;,&quot;&#x27;&quot;:&#x27;&amp;#39;&#x27;}[c]));
  const cents=v=&gt;/^\d+(\.\d{1,2})?$/.test(String(v))&amp;&amp;Number(v)&lt;=9999999?Math.round(Number(v)*100):null;
  const date=v=&gt;new Date(v+&#x27;T12:00:00&#x27;).toLocaleDateString(&#x27;en-CA&#x27;,{month:&#x27;short&#x27;,day:&#x27;numeric&#x27;,year:&#x27;numeric&#x27;});
  const total=()=&gt;state.amounts.reduce((s,v)=&gt;s+(cents(v)??0),0);
  const available=()=&gt;state.balance-state.reserved;
  const frozen=()=&gt;state.phase!==&#x27;draft&#x27;;
  const payrollTotal=()=&gt;state.snapshot?.total??total();
  const phaseLabel=()=&gt;({draft:&#x27;Draft&#x27;,submitted:&#x27;Submitted · Awaiting BC&#x27;,approved:&#x27;BC approved · Awaiting HO&#x27;,posted:&#x27;Batch posted&#x27;})[state.phase];
  const btn=(text,action,primary=false,disabled=false)=&gt;`&lt;button type=&quot;button&quot; class=&quot;sm-button${primary?&#x27; sm-primary&#x27;:&#x27;&#x27;}&quot; data-action=&quot;${action}&quot;${disabled?&#x27; disabled&#x27;:&#x27;&#x27;}&gt;${text}&lt;/button&gt;`;
  const notice=(text,type=&#x27;&#x27;)=&gt;`&lt;div class=&quot;sm-notice ${type}&quot;&gt;${text}&lt;/div&gt;`;
  function save(){
    if(window.openai?.setWidgetState) window.openai.setWidgetState({modelContent:{feature:&#x27;Marketing Management&#x27;,screen:state.screen,phase:state.phase,availableCredits:available()/100,reservedCredits:state.reserved/100,payrollMarketingTotal:payrollTotal()/100},privateContent:{kind:&#x27;simon-marketing-proposal&#x27;,sessionId,state}}).catch(()=&gt;{});
  }
  function restore(saved){
    // Ignore our own asynchronous persistence echo: it must not rebuild the
    // active checkout, clear transient test fields, or move an input caret.
    if(saved?.privateContent?.sessionId===sessionId)return;
    const s=saved?.privateContent?.state;
    if(saved?.privateContent?.kind!==&#x27;simon-marketing-proposal&#x27;||![1,2].includes(s?.version)||!SCREENS.includes(s.screen)||![&#x27;draft&#x27;,&#x27;submitted&#x27;,&#x27;approved&#x27;,&#x27;posted&#x27;].includes(s.phase))return;
    if(!Number.isSafeInteger(s.balance)||!Number.isSafeInteger(s.reserved)||s.reserved&lt;0||s.balance&lt;s.reserved||!Array.isArray(s.amounts)||s.amounts.length!==2||!Array.isArray(s.notes)||s.notes.length!==2||!Array.isArray(s.fundings)||s.fundings.length&gt;30)return;
    if(s.phase!==&#x27;draft&#x27;&amp;&amp;(!s.snapshot||!Array.isArray(s.snapshot.rows)||s.snapshot.rows.length!==2||!Number.isSafeInteger(s.snapshot.total)))return;
